<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>翻頁閱讀｜崇德仁義藏經閣</title>
  <link rel="stylesheet" href="../hemei-50th/reader.css?v=4">
  <script type="module" src="reader.js?v=3"></script>
</head>
<body>
  <header>
    <a href="../../library/">← 返回藏經閣</a>
    <div><strong id="bookTitle">典藏載入中</strong><small>線上翻頁典藏</small></div>
    <a id="downloadLink" download>下載 PDF</a>
  </header>
  <main>
    <div class="book-shell">
      <button id="prev" aria-label="上一頁">‹</button>
      <div class="book" id="book">
        <canvas id="page"></canvas>
        <div class="loading" id="loading">PDF 載入中…</div>
      </div>
      <button id="next" aria-label="下一頁">›</button>
    </div>
    <div class="controls">
      <button id="first">首頁</button>
      <span>第 <input id="pageNumber" type="number" min="1" value="1" aria-label="頁碼"> 頁，共 <b id="pageCount">—</b> 頁</span>
      <button id="fullscreen">全螢幕</button>
      <div class="zoom-controls" role="group" aria-label="頁面縮放"><button id="zoomOut" aria-label="縮小">−</button><span id="zoomLevel">100%</span><button id="zoomIn" aria-label="放大">＋</button><button id="zoomReset">恢復大小</button></div>
    </div>
    <p class="hint">點擊左右箭頭、使用鍵盤方向鍵，或在手機上左右滑動翻頁。</p>
  </main>
</body>
</html>
