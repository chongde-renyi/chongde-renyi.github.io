<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="靜心選擇一位仙佛，領受一則今日法語。">
  <title>感恩發愿｜仙佛慈語</title>
  <link rel="stylesheet" href="blessing.css">
  <script src="blessing.js" defer></script>
</head>
<body>
  <header><a href="../">← 崇德仁義總站</a><strong>感恩發愿 · 仙佛慈語</strong><span>靜心 · 誠意 · 領受</span></header>
  <main>
    <section class="screen active" id="choose" aria-labelledby="choose-title">
      <p class="eyebrow">每日一語 · 智慧相伴</p>
      <h1 id="choose-title">誠心合掌默禱</h1>
      <p class="lead">安定心念，帶著感恩與虔誠，選擇一位有緣仙佛，領受今日慈語。</p>
      <div class="choices">
        <button data-name="彌勒祖師"><b>彌</b><span>彌勒祖師</span><small>歡喜 · 包容</small></button>
        <button data-name="南極仙翁"><b>壽</b><span>南極仙翁</span><small>福慧 · 長養</small></button>
        <button data-name="濟公活佛"><b>濟</b><span>濟公活佛</span><small>自在 · 慈悲</small></button>
        <button data-name="月慧菩薩"><b>慧</b><span>月慧菩薩</span><small>明心 · 智慧</small></button>
        <button data-name="觀音菩薩"><b>觀</b><span>觀音菩薩</span><small>慈悲 · 聞聲</small></button>
        <button data-name="關聖帝君"><b>義</b><span>關聖帝君</span><small>忠義 · 正氣</small></button>
        <button data-name="白水聖帝"><b>道</b><span>白水聖帝</span><small>修辦 · 篤行</small></button>
        <button data-name="媽祖"><b>安</b><span>媽祖</span><small>護佑 · 平安</small></button>
      </div>
    </section>

    <section class="screen drawing" id="drawing" aria-live="polite">
      <div class="lot"><i></i><i></i><i></i><i></i><i></i></div>
      <h2>誠心感應中</h2><p>請合掌靜候片刻……</p>
    </section>

    <section class="screen result" id="result" aria-live="polite">
      <div class="seal" id="seal">慈</div>
      <p class="eyebrow" id="chosen-name"></p>
      <h2>今日慈語</h2>
      <blockquote id="quote"></blockquote>
      <p class="guidance" id="guidance"></p>
      <div class="actions"><button id="again">再次領受</button><button class="secondary" id="copy">複製慈語</button></div>
      <p class="note">此頁旨在靜心自省與善念提醒，慈語不作占卜或重大決策依據。</p>
    </section>
  </main>
  <footer>崇德仁義 · 存好心 · 說好話 · 行好事</footer>
</body>
</html>
