name: Sync YouTube videos

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video catalogue tool
        run: python -m pip install yt-dlp
      - name: Update public video catalogue
        run: python .github/scripts/sync_youtube_videos.py
      - name: Commit changes when videos changed
        run: |
          if git diff --quiet -- library/videos.json; then
            echo "No video changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library/videos.json
          git commit -m "chore: sync YouTube videos"
          git push
