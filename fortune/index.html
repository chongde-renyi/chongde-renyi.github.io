<script>const LOTS=[{"n":1,"grade":"\u4e0a\u4e0a","poem":"\u65e5\u51fa\u4fbf\u898b\u98a8\u96f2\u6563\uff0c\n\u5149\u660e\u6e05\u6de8\u7167\u4e16\u9593\uff1b\n\u4e00\u5411\u524d\u9014\u901a\u5927\u9053\uff0c\n\u842c\u4e8b\u6e05\u5409\u4fdd\u5e73\u5b89\u3002","story":"\u5305\u516c\u8acb\u96f7\u9a5a\u4ec1\u5b97","explanation":"\u6b64\u7c64\u8c61\u5fb5\u9670\u973e\u5c07\u6563\u3001\u5149\u660e\u6f38\u81f3\uff0c\u773c\u524d\u963b\u6eef\u591a\u70ba\u66ab\u6642\u3002\u53ea\u8981\u5b88\u6b63\u4e0d\u504f\u3001\u8010\u5fc3\u6301\u7e8c\u63a8\u9032\uff0c\u524d\u9014\u81ea\u6703\u8f49\u70ba\u901a\u9054\uff0c\u8af8\u4e8b\u53ef\u8da8\u6e05\u5409\u5e73\u5b89\u3002","jiazi":"\u7532\u5b50","englishTranslation":"The sun rises and the clouds disperse,\nBright light shines upon the world;\nThe future is clear and the road is wide,\nMay all things be peaceful and auspicious.","englishInterpretation":"Read this lot as guidance for reflection rather than a fixed prediction. The conditions are generally favorable; proceed with gratitude, integrity, and humility."},{"n":2,"grade":"\u4e2d\u5e73","poem":"\u4e8e\u4eca\u6b64\u666f\u6b63\u7576\u6642\uff0c\n\u770b\u770b\u6b32\u5410\u767e\u82b1\u9b41\uff1b\n\u82e5\u80fd\u9047\u5f97\u6625\u8272\u5230\uff0c\n\u4e00\u7051\u6e05\u5409\u812b\u5875\u57c3\u3002","story":"\u8d99\u5b50\u9f8d\u6551\u963f\u9b25\uff0f\u9673\u6771\u521d\u796d\u6885","explanation":"\u6b64\u7c64\u4ee5\u300c\u5bd2\u4e2d\u5f85\u6625\u3001\u542b\u82de\u6b32\u653e\u300d\u70ba\u8c61\uff0c\u8868\u793a\u773c\u524d\u60c5\u52e2\u96d6\u672a\u5b8c\u5168\u958b\u5c55\uff0c\u4f46\u5176\u5be6\u6b63\u8655\u65bc\u95dc\u9375\u919e\u91c0\u671f\u3002\u5b9c\u5b88\u6210\u84c4\u529b\u3001\u7b49\u5f85\u6642\u6a5f\uff08\u6625\u8272\u3001\u8cb4\u4eba\u3001\u5929\u6642\uff09\u4e00\u5230\uff0c\u4fbf\u80fd\u6d17\u76e1\u9670\u973e\u3001\u8f49\u56f0\u70ba\u9806\u3002","jiazi":"\u7532\u5bc5","englishTranslation":"This is the perfect time,\nSee how the most beautiful flowers are about to bloom;\nIf spring arrives,\nA shower of clear light will wash away the dust.","englishInterpretation":"Read this lot as guidance for reflection rather than a fixed prediction. The situation is balanced or still developing; stay steady, observe carefully, and avoid forcing a result."},{"n":3,"grade":"\u4e2d\u5409","poem":"\u52f8\u541b\u628a\u5b9a\u5fc3\u83ab\u865b\uff0c\u5929\u6ce8\u8863\u797f\u81ea\u6709\u9918\uff1b\n\u548c\u5408\u91cd\u91cd\u5e38\u5409\u6176\uff0c\u6642\u4f86\u7d42\u9047\u5f97\u660e\u73e0\u3002","story":"\u5468\u5fb7\u6b66\u8207\u5f35\u745e\u82f1\u5718\u5713","explanation":"\u6b64\u7c64\u4e3b\u65e8\u5728\u300c\u5b9a\u5fc3\u300d\u8207\u300c\u548c\u5408\u300d\u3002\u798f\u797f\u6839\u57fa\u4e0d\u5dee\uff0c\u4f46\u6210\u4e8b\u9808\u9760\u5c08\u6ce8\u5805\u6301\u3001\u5c11\u7591\u5c11\u8b8a\uff0c\u4e26\u4ee5\u548c\u6c23\u8655\u7406\u4eba\u969b\u8207\u5bb6\u5ead\uff1b\u5f85\u6642\u6a5f\u4e00\u5230\uff0c\u81ea\u80fd\u5f97\u8cb4\u4eba\u8207\u6210\u679c\uff0c\u5982\u540c\u7d42\u9047\u660e\u73e0\u3002","jiazi":"\u7532\u8fb0","englishTranslation":"I advise you to keep your mind focused and not be vain, Heaven will provide you with ample food and clothing;\nHarmony and good fortune will always bring you joy, and when the time comes, you will finally meet your match.","englishInterpretation":"Read this lot as guidance for reflection rather than a fixed prediction. A constructive outcome is possible when you remain patient, sincere, and attentive to timing."},{"n":4,"grade":"\u4e0a\u4e0a","poem":"\u98a8\u606c\u6d6a\u975c\u53ef\u884c\u821f\uff0c\u6070\u662f\u4e2d\u79cb\u6708\u4e00\u8f2a\uff1b\n\u51e1\u4e8b\u4e0d\u9808\u591a\u6182\u616e\uff0c\u798f\u797f\u81ea\u6709\u6176\u5bb6\u9580\u3002","story":"\u76e7\u9f8d\u738b\u6b21\u5973\u62db\u89aa","explanation":"\u6b64\u7c64\u4ee5\u300c\u98a8\u5e73\u6d6a\u975c\u3001\u660e\u6708\u6b63\u5713\u300d\u55bb\u793a\u6642\u6a5f\u6210\u719f\u3001\u74b0\u5883\u9806\u9042\uff0c\u51e1\u4e8b\u53ef\u8d81\u52e2\u63a8\u9032\u3002\u52ff\u56e0\u591a\u616e\u800c\u81ea\u64fe\uff0c\u5b88\u6b63\u8e0f\u5be6\u5247\u798f\u797f\u81ea\u4f86\u3001\u5bb6\u9580\u6709\u559c\u3002","jiazi":"\u7532\u5348","englishTranslation":"The wind is calm and the waves are still, perfect for sailing, just like the full moon of Mid-Autumn Festival;\nThere is no need to worry too much, Fortune and prosperity will naturally come to your home.","englishInterpretation":"Read this lot as guidance for reflection rather than a fixed prediction. The conditions are generally favorable; proceed with gratitude, integrity, and humility."},{"n":5,"grade":"\u4e2d\u5e73","poem":"\u96bb\u6050\u524d\u9014\u547d\u6709\u8b8a\uff0c\u52f8\u541b\u4f5c\u6025\u53ef\u5b9c\u5148\uff1b\n\u4e14\u5b88\u9577\u6c5f\u7121\u5927\u4e8b\uff0c\u547d\u9022\u592a\u767d\u5b88\u8eab\u908a\u3002","story":"\u738b\u526a\u6230\u8881\u9054","explanation":"\u6b64\u7c64\u793a\u610f\u524d\u8def\u6050\u6709\u8b8a\u6578\uff0c\u8d8a\u662f\u5fc3\u6025\u8d8a\u5bb9\u6613\u51fa\u932f\uff0c\u9700\u5148\u7a69\u4f4f\u9663\u8173\u3002\u5b88\u6210\u4e0d\u52d5\u3001\u6309\u90e8\u5c31\u73ed\uff0c\u4e26\u4fee\u8eab\u7a4d\u5fb7\uff0c\u5f97\u592a\u767d\u661f\u8b77\u6301\uff0c\u53ef\u6e1b\u5c11\u6ce2\u6298\u3001\u5f85\u6642\u8f49\u6a5f\u3002","jiazi":"\u7532\u7533","englishTranslation":"I fear that your future may be uncertain, I advise you to act quickly;\nStay on the Yangtze River and nothing major will happen, for you are blessed with Venus by your side.","englishInterpretation":"Read this lot as guidance for reflection rather than a fixed prediction. The situation is balanced or still developing; stay steady, observe carefully, and avoid forcing a result."},{"n":6,"grade":"\u4e2d\u4e0b","poem":"\u98a8\u96f2\u7dfb\u96e8\u843d\u6d0b\u6d0b\uff0c\n\u5929\u707d\u6642\u6c23\u5fc5\u6709\u50b7\uff1b\n\u547d\u5185\u6b64\u4e8b\u96e3\u548c\u5408\uff0c\n\u66f4\u9022\u4e00\u8db3\u51fa\u5916\u9109\u3002","story":"\u5289\u667a\u9060\u6230\u74dc\u7cbe","explanation":"\u6b64\u7c64\u4ee5\u98a8\u96e8\u5929\u707d\u70ba\u8c61\uff
